<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 🌼</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial;
    background:linear-gradient(#fff8cc,#ffe680);
    overflow:hidden;
}

h1{
    color:#8a6d00;
}

#contador{
    font-size:22px;
    margin-top:10px;
}

.flower{
    position:absolute;
    font-size:30px;
    animation:caer linear infinite;
}

@keyframes caer{
    0%{
        transform:translateY(-100px) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(100vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<h1>Flores amarillas para ti 🌼</h1>
<p id="contador"></p>

<script>

// CONTADOR DESDE UNA FECHA
const fechaInicio = new Date("2025-12-28 00:00:00");

function actualizarContador(){

let ahora = new Date();
let diferencia = ahora - fechaInicio;

let dias = Math.floor(diferencia / (1000*60*60*24));
let horas = Math.floor((diferencia/(1000*60*60))%24);
let minutos = Math.floor((diferencia/(1000*60))%60);
let segundos = Math.floor((diferencia/1000)%60);

document.getElementById("contador").innerHTML =
dias + " días " + horas + " horas " + minutos + " minutos " + segundos + " segundos";
}

setInterval(actualizarContador,1000);


// FLORES CAYENDO
function crearFlor(){

let flor = document.createElement("div");
flor.classList.add("flower");
flor.innerHTML = "🌼";

flor.style.left = Math.random()*100+"vw";
flor.style.animationDuration = (3+Math.random()*5)+"s";

document.body.appendChild(flor);

setTimeout(()=>{
flor.remove();
},8000);

}

setInterval(crearFlor,300);

</script>

</body>
</html>
